[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-temporal-grounding"
version = "0.1.0"
description = "Native SFT time representation and TimeLens GRPO comparison experiments"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["vtg*", "evaluation*"]
